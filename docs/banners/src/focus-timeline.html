<!doctype html>
<html><head><meta charset="utf-8"><title>focus-timeline</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* Overview's "Today at North Quay" timeline (Light): the shift's vessels, tide and crane moves on one NOW line.
     The card turns slightly toward the viewer; the Needs-you panel sits behind it, out of focus. */
  .stage { background:
      radial-gradient(55% 70% at 66% 50%, rgba(251,251,250,1) 0%, rgba(251,251,250,0) 70%),
      linear-gradient(135deg, #E0EAEF 0%, #EEF2F2 45%, #F3F3F1 70%, #E4ECEF 100%); }
  .glow { position: absolute; left: 520px; top: 120px; width: 600px; height: 420px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(28,110,158,.16), rgba(28,110,158,0)); filter: blur(20px); }
  .card { position: absolute; border-radius: 16px; overflow: hidden; }
  .card img { width: 100%; }
  .back { left: 70px; top: 96px; width: 320px; transform: perspective(1400px) rotateY(16deg) rotateX(4deg) scale(.96);
    filter: blur(3.5px) saturate(.9); opacity: .75;
    box-shadow: 0 30px 60px -20px rgba(18,22,23,.25); }
  .front { left: 302px; top: 62px; width: 772px; transform: perspective(1800px) rotateY(-13deg) rotateX(5deg);
    transform-origin: 30% 50%;
    box-shadow: 0 0 0 1px rgba(18,22,23,.06), 0 2px 4px rgba(18,22,23,.05), 0 18px 40px -12px rgba(18,22,23,.20),
                0 60px 90px -30px rgba(15,74,110,.35);
    -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%); }
</style></head>
<body><div class="stage grain">
  <div class="glow"></div>
  <div class="card back"><img src="cap/light-desk-needsyou@3x.png"></div>
  <div class="card front"><img src="cap/light-desk-timeline@3x.png"></div>
</div></body></html>
