<!doctype html>
<html><head><meta charset="utf-8"><title>focus-river</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* Fleet & waterways (Dark): a macro crop of the live Alder River map, km 80 to km 0 (Nordbank, Alder Trader at
     Lock 2, Westhaven Spirit, Westhaven Pride at Lock 1, Tug Kestrel), turned so the river runs uphill across the
     card, its edges let go into the night Background, with a sea-green glow (SeaGreen #1E8F7A). */
  .stage { background:
      radial-gradient(50% 40% at 52% 50%, rgba(30,143,122,.16) 0%, rgba(30,143,122,0) 70%),
      radial-gradient(75% 65% at 50% 50%, #1D2427 0%, #1A2124 40%, #13181B 75%, #0F1315 100%); --grain: .05; }
  /* the map's own ground (#1D2427 at the top, #222A2C below) is the centre of the backdrop, so the crop dissolves */
  .map { position: absolute; left: 50%; top: 50%; width: 1050px; height: 273px; margin: -146px 0 0 -547px;
    transform: perspective(1700px) rotateX(12deg) rotateZ(-6deg);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 97%, transparent 100%),
                        linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .map img { width: 100%; height: 100%; }
</style></head>
<body><div class="stage grain">
  <div class="map"><img src="cap/dark-desk-river@3x.png"></div>
</div></body></html>
