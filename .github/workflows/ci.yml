name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: Cargo/Cargo.csproj

# Every job builds one head through -p:CargoTargetFrameworks, which the vendored Liveline project follows,
# so no job restores a head (or needs a workload) it does not build. The tests use the app's plain net10.0 build.
jobs:
  test:
    name: Unit tests (Cargo.Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test
        run: dotnet test Cargo.Tests/Cargo.Tests.csproj -c Release -p:CargoTargetFrameworks=net10.0

  desktop:
    name: Desktop (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-desktop -c Release -r ${{ matrix.rid }} --self-contained -p:CargoTargetFrameworks=net10.0-desktop -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-desktop-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  windows:
    name: Windows (WinAppSDK build check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build the WinAppSDK head (x64, unsigned)
        # The Skia desktop job above covers Windows too, through Win32. This one proves the native WinUI head compiles;
        # SKCanvasElement needs x64 or ARM64 there, never AnyCPU.
        run: dotnet build ${{ env.PROJECT }} -f net10.0-windows10.0.19041 -c Release -p:Platform=x64 -p:CargoTargetFrameworks=net10.0-windows10.0.19041

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-browserwasm -c Release -p:CargoTargetFrameworks=net10.0-browserwasm -o publish/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-wasm
          path: publish/wasm/wwwroot

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install android workload
        run: dotnet workload install android
      - name: Restore signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cargo.keystore"
      - name: Publish (signed when the keystore secrets exist, debug-signed otherwise)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          SIGN=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            SIGN="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/cargo.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_STORE_PASSWORD"
          fi
          # One format per publish: a list value did not produce both packages.
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:CargoTargetFrameworks=net10.0-android -p:AndroidPackageFormat=aab $SIGN -o publish/android
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:CargoTargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk $SIGN -o publish/android
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-android
          path: |
            publish/android/*.aab
            publish/android/*.apk

  ios:
    name: iOS (simulator build check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.3xx'
      - name: Pin Xcode and the iOS workload together
        # Each .NET for iOS release requires one exact Xcode. Workload set 10.0.300 ships iOS 26.2, which requires
        # Xcode 26.3; the hosted image keeps it side by side with its 26.6 default. Bump both together.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          dotnet workload install ios --version 10.0.300
      - name: Build for the simulator (no signing)
        # Store builds need an Apple Developer account, a distribution certificate and a provisioning profile.
        # This job proves the iOS head compiles.
        run: dotnet build ${{ env.PROJECT }} -f net10.0-ios -c Release -r iossimulator-arm64 -p:CargoTargetFrameworks=net10.0-ios
